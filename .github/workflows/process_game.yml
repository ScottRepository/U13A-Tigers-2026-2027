name: Auto-Sync YouTube Games & GameSheet

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_reanalyze_ids:
        description: 'Comma-separated YouTube video IDs to force re-analyze with Two-Pass Gemini 4 Carbon'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check_and_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp google-genai requests opencv-python-headless numpy ultralytics

      - name: Sync Live GameSheet Data (York Simcoe U13A Season #15490)
        run: python sync_gamesheet.py || true

      - name: Run Auto Sync Script (Two-Pass High-Accuracy Gemini + GameSheet Alignment)
        run: python auto_sync.py
        env:
          YOUTUBE_SOURCE: "https://www.youtube.com/playlist?list=PLXFVFYYSmylE"
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMSNAP_ICAL_URL: ${{ secrets.TEAMSNAP_ICAL_URL }}
          FORCE_REANALYZE_IDS: ${{ inputs.force_reanalyze_ids }}

      - name: Run Zero-Token Computer Vision Tracker (YOLOv8 + ByteTrack + Rink Homography)
        run: python cv_tracker.py --library games_library.json --out-dir tracking || true
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Hockey Auto Bot"
          git config --global user.email "bot@hockey-app.local"
          TARGET_BRANCH="${GITHUB_REF_NAME:-main}"
          git add games_library.json tracking/ gamesheet_league_data.json live_game_state.json index.html
          git diff --staged --quiet || (git commit -m "chore(sync): auto-synced YouTube games, Carbon stop-time clips & GameSheet data [skip ci]" && git pull --rebase origin "$TARGET_BRANCH" && git push origin "$TARGET_BRANCH")
