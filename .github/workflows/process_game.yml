name: Auto-Sync YouTube Games

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_and_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp ultralytics supervision opencv-python-headless numpy requests

      - name: Run Auto Sync Script
        run: python auto_sync.py
        env:
          YOUTUBE_SOURCE: "https://www.youtube.com/playlist?list=PLXFVFYYSmylE"
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TEAMSNAP_ICAL_URL: ${{ secrets.TEAMSNAP_ICAL_URL }}

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Hockey Auto Bot"
          git config --global user.email "bot@hockey-app.local"
          git add games_library.json
          git diff --staged --quiet || (git commit -m "chore(sync): update games_library.json [skip ci]" && git push origin main)
